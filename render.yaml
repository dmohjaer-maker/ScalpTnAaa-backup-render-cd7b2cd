services:
  # ─── mt5rest Docker bridge ─────────────────────────────────────────────────
  - type: web
    name: goldscalper-mtapi
    runtime: docker
    dockerfilePath: ./mtapi-bridge/Dockerfile
    dockerContext: ./mtapi-bridge
    plan: free
    healthCheckPath: /Ping
    # Only redeploy when mtapi-bridge files actually change.
    # Without this filter, every Python commit (live_trading/, telegram_panel/)
    # triggers an unnecessary Docker redeploy that restarts Wine/MT5 from
    # scratch — the primary cause of the repeated "Failed deploy" status.
    buildFilter:
      paths:
        - mtapi-bridge/**
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: "https://goldscalper-mtapi-rqho.onrender.com"
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false

  # ─── Redis — cross-service IPC (robot ↔ Telegram panel) ───────────────────
  # FIX: must be in the same region as the robot/panel web services (oregon).
  # It was previously created in frankfurt, so its private hostname never
  # resolved from oregon — the panel silently never saw live position/state
  # updates from the robot even though the robot itself was healthy.
  - type: redis
    name: goldscalper-redis
    plan: free
    region: oregon
    ipAllowList: []   # private — Render internal routing only; no public access

  # ─── Trading robot ─────────────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-robot
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r live_trading/requirements.txt
    startCommand: python live_trading/server.py
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: "https://goldscalper-v4-robot-bpqa.onrender.com"
      - key: MTAPI_URL
        value: "https://goldscalper-mtapi-rqho.onrender.com"
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      # FIX: broker reports gold as "XAUUSD", not "XAUUSDb" — the wrong
      # symbol caused every candle/order request to fail silently, which was
      # the real reason the robot never opened a trade.
      - key: SYMBOL
        value: XAUUSD
      # M1 is the execution/entry timeframe. M5 provides confirmation;
      # H1 remains the higher-timeframe directional filter below.
      - key: TIMEFRAME
        value: "1m"
      - key: CANDLE_WINDOW
        value: "500"
      # PriceHistoryV2 auto-detects broker-local candle time versus UTC.
      # Set a decimal-hour offset here only if the broker's server clock is
      # known and auto-detection is unsuitable (for example, 3.5 or -4).
      - key: MT5_SERVER_UTC_OFFSET_HOURS
        value: "auto"
      # Option 4: old BOS/CHoCH events cannot authorize live entries.
      # M1 bars are shorter, so keep a structure actionable for about one hour
      # instead of using the old M5-specific 24-bar window.
      - key: STRUCTURE_MAX_AGE_BARS
        value: "60"
      - key: RISK_PERCENT
        value: "1.0"
      # Aggressive M1 range policy:
      # RANGE: 2 confirmations are allowed, while confidence, quality, MTF,
      # retest, R:R, and Guardian gates remain active.
      # HIGH_VOLATILITY remains at 3 confirmations plus Price Action.
      - key: MIN_CONFIRMATIONS
        value: "2"
      - key: REQUIRE_PRICE_ACTION
        value: "false"
      - key: RANGE_MIN_CONFIRMATIONS
        value: "2"
      - key: RANGE_REQUIRE_PRICE_ACTION
        value: "false"
      - key: M1_RANGE_MIN_CONFIDENCE
        value: "55"
      - key: M1_RANGE_MIN_RR
        value: "1.6"
      - key: M5_RANGE_MIN_CONFIDENCE
        value: "60"
      - key: M5_RANGE_MIN_RR
        value: "2.0"
      - key: M1_REQUIRE_BREAK_RETEST
        value: "false"
      - key: M5_REQUIRE_BREAK_RETEST
        value: "true"
      - key: REQUIRE_SMC_PRICE_ACTION_WYCKOFF
        value: "false"
      - key: CONF_HARD_MIN
        value: "40"
      - key: DAILY_LOSS_LIMIT_PCT
        value: "3.0"
      - key: MAX_DRAWDOWN_PCT
        value: "8.0"
      - key: SLIPPAGE_POINTS
        value: "30"
      # Smart candle-aware trailing stop.  The stop activates at +1.0R,
      # follows the best favorable quote, respects confirmed swing structure,
      # and tightens after two opposing closed candles.
      - key: TRAIL_ENABLED
        value: "true"
      - key: TRAIL_ACTIVATION_R
        value: "1.0"
      - key: TRAIL_PEAK_ATR_GAP_MULT
        value: "1.10"
      - key: TRAIL_PEAK_R_GAP_MULT
        value: "0.60"
      - key: TRAIL_STRUCTURE_BUFFER_ATR
        value: "0.18"
      - key: TRAIL_REVERSAL_CONFIRMATION_BARS
        value: "2"
      - key: TRAIL_REVERSAL_TIGHTEN_ATR_MULT
        value: "0.75"
      - key: TRAIL_SWING_LOOKBACK
        value: "2"
      - key: TRAIL_LOCK_BUFFER_R
        value: "0.08"
      - key: TRAIL_ATR_GAP_MULT
        value: "0.8"
      - key: TRAIL_MIN_STEP_PRICE
        value: "0.05"
      - key: TP_STRUCTURE_BUFFER_ATR
        value: "0.15"
      # TRADE_TIMEFRAMES / QUALITY_ADX_MIN / MTF settings are explicit here so
      # a Render redeploy cannot silently fall back to a different policy.
      - key: TRADE_TIMEFRAMES
        value: "M5,1m"
      - key: M1_EXECUTION_REQUIRED
        value: "true"
      - key: QUALITY_ADX_MIN
        value: "12"
      - key: MTF_ENABLED
        value: "true"
      - key: MTF_TIMEFRAME
        value: "H1"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: STATE_FILE
        value: "/tmp/robot_state.json"
      - key: MT5_SNAPSHOT
        value: "/tmp/robot_mt5_snapshot.json"
      - key: COMMANDS_FILE
        value: "/tmp/robot_commands.json"
      - key: GUARDIAN_STATE_FILE
        value: "/tmp/guardian_state.json"
      - key: LOG_FILE
        value: "/tmp/robot.log"
      - key: REDIS_URL
        fromService:
          type: redis
          name: goldscalper-redis
          property: connectionString
      # FIX #1: ROBOT_COMMAND_TOKEN enables HTTP command fallback from panel.
      - key: ROBOT_COMMAND_TOKEN
        sync: false

  # ─── Telegram control panel ────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-panel
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r telegram_panel/requirements.txt
    startCommand: python telegram_panel/server.py
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: "https://goldscalper-v4-panel-e07b.onrender.com"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: PANEL_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PANEL_DB_PATH
        value: "/tmp/panel.db"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_ACCOUNT_TYPE
        value: "demo"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ROBOT_INTERFACE_MODE
        value: "redis"
      - key: ROBOT_STATE_PATH
        value: "/tmp/robot_state.json"
      # FIX #1: ROBOT_BASE_URL and ROBOT_COMMAND_TOKEN enable HTTP fallback.
      - key: ROBOT_BASE_URL
        value: "https://goldscalper-v4-robot-bpqa.onrender.com"
      - key: ROBOT_COMMAND_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: goldscalper-redis
          property: connectionString
