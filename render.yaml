services:
  # ─── Legacy self-hosted mt5rest bridge ─────────────────────────────────────
  # The robot and panel use the official hosted MTAPI endpoint below. Keep this
  # service available only for compatibility/rollback; its public image is a
  # time-limited trial and must not be used as the production connection path.
  - type: web
    name: goldscalper-mtapi
    runtime: docker
    dockerfilePath: ./mtapi-bridge/Dockerfile
    plan: free
    healthCheckPath: /Ping
    # Only redeploy when mtapi-bridge files actually change.
    # Without this filter, every Python commit (live_trading/, telegram_panel/)
    # triggers an unnecessary Docker redeploy that restarts Wine/MT5 from
    # scratch — the primary cause of the repeated "Failed deploy" status.
    paths:
      - mtapi-bridge/**
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: "https://goldscalper-mtapi-clzt.onrender.com"
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false

  # ─── Redis — cross-service IPC (robot ↔ Telegram panel) ───────────────────
  # FIX: must be in the same region as the robot/panel web services (oregon).
  # It was previously created in frankfurt, so its private hostname never
  # resolved from oregon — the panel silently never saw live position/state
  # updates from the robot even though the robot itself was healthy.
  - type: redis
    name: goldscalper-redis
    plan: free
    region: oregon
    ipAllowList: []   # private — Render internal routing only; no public access

  # ─── Trading robot ─────────────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-robot
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r live_trading/requirements.txt
    startCommand: python live_trading/server.py
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: "https://goldscalper-v4-robot-zk6i.onrender.com"
      - key: MTAPI_URL
        value: "https://mt5.mtapi.io"
      - key: MTAPI_KEEPALIVE_URL
        value: "https://mt5.mtapi.io"
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      # FIX: broker reports gold as "XAUUSD", not "XAUUSDb" — the wrong
      # symbol caused every candle/order request to fail silently, which was
      # the real reason the robot never opened a trade.
      - key: SYMBOL
        value: XAUUSD
      # FIX: TIMEFRAME and CANDLE_WINDOW are now env-configurable (fix #4).
      - key: TIMEFRAME
        value: "5m"
      - key: CANDLE_WINDOW
        value: "300"
      # Option 4: old BOS/CHoCH events cannot authorize live entries.
      - key: STRUCTURE_MAX_AGE_BARS
        value: "24"
      # Redeploy trigger: flexible entry mode is the intended production default.
      # Entry filters disabled by request: preserve only technical quote validity
      # and core risk controls; do not use MTF alignment as an entry gate.
      - key: STRICT_ENTRY_MODE
        value: "false"
      - key: MTF_ENABLED
        value: "false"
      - key: MTF_REQUIRE_ALIGNMENT
        value: "false"
      - key: ENTRY_TRIGGER_MAX_AGE_BARS
        value: "4"
      - key: MAX_ENTRY_DRIFT_ATR
        value: "0.50"
      - key: MAX_SPREAD_ATR
        value: "0.50"
      - key: RISK_PERCENT
        value: "1.0"
      - key: MAX_OPEN_TRADES
        value: "3"
      # Bounded XAUUSD M5 initial-stop calibration: enough room for normal
      # candle noise, while preventing a distant historical swing from
      # creating an untradeable stop.
      - key: SL_ATR_BUFFER_MULT
        value: "0.15"
      - key: SL_MIN_ATR_MULT
        value: "1.80"
      - key: SL_MAX_ATR_MULT
        value: "3.50"
      - key: SL_SPREAD_BUFFER_MULT
        value: "1.50"
      - key: TP_RR
        value: "1.50"
      - key: TP_MIN_RR
        value: "1.20"
      - key: TP_MAX_RR
        value: "2.00"
      - key: TP_APPROACH_ATR_MULT
        value: "0.15"
      # STABLE v4.0.4 values -- these are the actual settings the bot has been
      # running with in production (verified against the live Render service
      # on 2026-08-10). Earlier revisions of this file had leftover
      # "testing mode" values (MIN_CONFIRMATIONS=1, CONF_HARD_MIN=0,
      # DAILY_LOSS_LIMIT_PCT=50.0, MAX_DRAWDOWN_PCT=50.0) that no longer
      # matched the dashboard-configured production values below -- a fresh
      # deploy from the old file would NOT have reproduced current behavior.
      - key: MIN_CONFIRMATIONS
        value: "2"
      - key: REQUIRE_PRICE_ACTION
        value: "true"
      - key: REQUIRE_SMC_PRICE_ACTION_WYCKOFF
        value: "true"
      - key: CONF_HARD_MIN
        value: "32"
      - key: DAILY_LOSS_LIMIT_PCT
        value: "4.0"
      - key: MAX_DRAWDOWN_PCT
        value: "12.0"
      - key: SLIPPAGE_POINTS
        value: "30"
      # Adaptive high-water trailing protection. These values are explicit in
      # the deployment manifest so a fresh Render sync preserves the same
      # behavior as the robot code.
      - key: TRAIL_ENABLED
        value: "true"
      - key: TRAIL_ACTIVATION_R
        value: "0.90"
      - key: TRAIL_STEP_R
        value: "0.75"
      - key: TRAIL_LOCK_BUFFER_R
        value: "0.10"
      - key: TRAIL_ATR_GAP_MULT
        value: "1.10"
      - key: TRAIL_SPREAD_GAP_MULT
        value: "2.50"
      - key: TRAIL_MAX_GAP_R
        value: "0.90"
      - key: TRAIL_MIN_STEP_PRICE
        value: "0.10"
      - key: TRAIL_CHECK_INTERVAL
        value: "3.0"
      # TRADE_TIMEFRAMES / QUALITY_ADX_MIN are read by the live engine and
      # were set on the live service but missing from this manifest.
      - key: TRADE_TIMEFRAMES
        value: "M20,M15,M10,5m"
      - key: QUALITY_ADX_MIN
        value: "12"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: STATE_FILE
        value: "/tmp/robot_state.json"
      - key: MT5_SNAPSHOT
        value: "/tmp/robot_mt5_snapshot.json"
      - key: COMMANDS_FILE
        value: "/tmp/robot_commands.json"
      - key: GUARDIAN_STATE_FILE
        value: "/tmp/guardian_state.json"
      - key: LOG_FILE
        value: "/tmp/robot.log"
      - key: REDIS_URL
        fromService:
          type: redis
          name: goldscalper-redis
          property: connectionString
      # FIX #1: ROBOT_COMMAND_TOKEN enables HTTP command fallback from panel.
      - key: ROBOT_COMMAND_TOKEN
        sync: false

  # ─── Telegram control panel ────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-panel
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r telegram_panel/requirements.txt
    startCommand: python telegram_panel/server.py
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: "https://goldscalper-v4-panel-5fe0.onrender.com"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: PANEL_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PANEL_DB_PATH
        value: "/tmp/panel.db"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_ACCOUNT_TYPE
        value: "demo"
      - key: MTAPI_URL
        value: "https://mt5.mtapi.io"
      - key: MTAPI_KEEPALIVE_URL
        value: "https://mt5.mtapi.io"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ROBOT_INTERFACE_MODE
        value: "redis"
      - key: ROBOT_STATE_PATH
        value: "/tmp/robot_state.json"
      # FIX #1: ROBOT_BASE_URL and ROBOT_COMMAND_TOKEN enable HTTP fallback.
      - key: ROBOT_BASE_URL
        value: "https://goldscalper-v4-robot-zk6i.onrender.com"
      - key: ROBOT_COMMAND_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: goldscalper-redis
          property: connectionString
