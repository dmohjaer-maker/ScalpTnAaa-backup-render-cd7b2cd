services:
  # ─── mt5rest Docker bridge ─────────────────────────────────────────────────
  - type: web
    name: goldscalper-mtapi
    runtime: docker
    dockerfilePath: ./mtapi-bridge/Dockerfile
    plan: free
    healthCheckPath: /Ping
    envVars:
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false

  # ─── Redis — cross-service IPC (robot ↔ Telegram panel) ───────────────────
  - type: redis
    name: goldscalper-redis
    plan: free
    ipAllowList: []   # private — Render internal routing only; no public access

  # ─── Trading robot ─────────────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-robot
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r live_trading/requirements.txt
    startCommand: python live_trading/server.py
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: "https://goldscalper-v4-robot.onrender.com"
      - key: MTAPI_URL
        value: "https://goldscalper-mtapi.onrender.com"
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: SYMBOL
        value: XAUUSDb
      # FIX: TIMEFRAME and CANDLE_WINDOW are now env-configurable (fix #4).
      - key: TIMEFRAME
        value: "5m"
      - key: CANDLE_WINDOW
        value: "300"
      - key: RISK_PERCENT
        value: "1.0"
      # FIX #3: Raised from "2" to "3" (code default) for safer entries.
      - key: MIN_CONFIRMATIONS
        value: "3"
      - key: DAILY_LOSS_LIMIT_PCT
        value: "3.0"
      - key: MAX_DRAWDOWN_PCT
        value: "8.0"
      - key: SLIPPAGE_POINTS
        value: "30"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: STATE_FILE
        value: "/tmp/robot_state.json"
      - key: MT5_SNAPSHOT
        value: "/tmp/robot_mt5_snapshot.json"
      - key: COMMANDS_FILE
        value: "/tmp/robot_commands.json"
      - key: GUARDIAN_STATE_FILE
        value: "/tmp/guardian_state.json"
      - key: LOG_FILE
        value: "/tmp/robot.log"
      - key: REDIS_URL
        fromService:
          type: redis
          name: goldscalper-redis
          property: connectionString
      # FIX #1: ROBOT_COMMAND_TOKEN enables HTTP command fallback from panel.
      - key: ROBOT_COMMAND_TOKEN
        sync: false

  # ─── Telegram control panel ────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-panel
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r telegram_panel/requirements.txt
    startCommand: python telegram_panel/server.py
    envVars:
      - key: RENDER_EXTERNAL_URL
        value: "https://goldscalper-v4-panel.onrender.com"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: PANEL_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PANEL_DB_PATH
        value: "/tmp/panel.db"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_ACCOUNT_TYPE
        value: "demo"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ROBOT_INTERFACE_MODE
        value: "redis"
      - key: ROBOT_STATE_PATH
        value: "/tmp/robot_state.json"
      # FIX #1: ROBOT_BASE_URL and ROBOT_COMMAND_TOKEN enable HTTP fallback.
      - key: ROBOT_BASE_URL
        value: "https://goldscalper-v4-robot.onrender.com"
      - key: ROBOT_COMMAND_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: goldscalper-redis
          property: connectionString
