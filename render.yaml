services:
  # ─── mt5rest Docker bridge ─────────────────────────────────────────────────
  # Runs MT5 on Linux (via Wine) and exposes a REST API.
  # The robot service calls this bridge instead of MetaAPI cloud.
  - type: web
    name: goldscalper-mtapi
    runtime: docker
    dockerfilePath: ./mtapi-bridge/Dockerfile
    plan: free
    # BUG #1 FIX: "/" returns HTTP 301 redirect; Render health check requires
    # HTTP 200. "/Ping" returns 200 directly from mt5rest.
    healthCheckPath: /Ping
    envVars:
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false

  # ─── Redis — cross-service IPC (robot ↔ Telegram panel) ───────────────────
  # Required because robot and panel run as separate Render services with
  # separate filesystems and CANNOT share JSON state files directly.
  # Redis bridges robot state writes → panel reads, and panel commands → robot.
  - type: redis
    name: goldscalper-redis
    plan: free
    # Render rejects connections when this list is empty.  Keep Redis
    # reachable by the robot and Telegram panel services over TLS.
    ipAllowList:
      - cidrBlock: 0.0.0.0/0
        description: robot and panel IPC

  # ─── Trading robot ─────────────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-robot
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r live_trading/requirements.txt
    startCommand: python live_trading/server.py
    envVars:
      # ── mt5rest bridge URL (set to the goldscalper-mtapi service URL) ──────
      - key: MTAPI_URL
        value: "https://goldscalper-mtapi.onrender.com"
      # ── MT5 broker credentials ──────────────────────────────────────────────
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      # ── Symbol & strategy ───────────────────────────────────────────────────
      - key: SYMBOL
        value: XAUUSDb
      - key: RISK_PERCENT
        value: "1.0"
      - key: MIN_CONFIRMATIONS
        value: "2"
      # ── Risk Guardian circuit breakers ──────────────────────────────────────
      - key: DAILY_LOSS_LIMIT_PCT
        value: "3.0"
      - key: MAX_DRAWDOWN_PCT
        value: "8.0"
      - key: SLIPPAGE_POINTS
        value: "30"
      # ── Runtime ─────────────────────────────────────────────────────────────
      - key: PYTHON_VERSION
        value: "3.11.0"
      # ── State files ─────────────────────────────────────────────────────────
      - key: STATE_FILE
        value: "/tmp/robot_state.json"
      - key: MT5_SNAPSHOT
        value: "/tmp/robot_mt5_snapshot.json"
      - key: COMMANDS_FILE
        value: "/tmp/robot_commands.json"
      - key: GUARDIAN_STATE_FILE
        value: "/tmp/guardian_state.json"
      - key: LOG_FILE
        value: "/tmp/robot.log"
      # Shared secret for the panel's HTTP command fallback.
      - key: ROBOT_COMMAND_TOKEN
        sync: false
      # ── Redis IPC — auto-wired from the goldscalper-redis service ────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: goldscalper-redis
          property: connectionString

  # ─── Telegram control panel ────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-panel
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r telegram_panel/requirements.txt
    startCommand: python telegram_panel/server.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: PANEL_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PANEL_DB_PATH
        value: "/tmp/panel.db"
      # ── MT5 credentials — used by auto_seed to restore account after restart ─
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_ACCOUNT_TYPE
        value: "demo"
      - key: LOG_LEVEL
        value: "INFO"
      # ── Robot control interface ────────────────────────────────────────────
      # The panel and robot run as separate Render services; use the robot's
      # public HTTP interface instead of local file IPC.
      - key: ROBOT_INTERFACE_MODE
        value: "http"
      - key: ROBOT_BASE_URL
        value: "https://goldscalper-v4-robot.onrender.com"
      - key: ROBOT_COMMAND_TOKEN
        sync: false
      - key: ROBOT_STATE_PATH
        value: "/tmp/robot_state.json"
      # ── Redis IPC — auto-wired from the goldscalper-redis service ────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: goldscalper-redis
          property: connectionString
